services:
  postgres:
    image: postgres:17-alpine
    container_name: lol-rank-postgres
    environment:
      POSTGRES_DB: ${PGDATABASE:-lolrank}
      POSTGRES_USER: ${PGUSER:-lolrank}
      POSTGRES_PASSWORD: ${PGPASSWORD:-lolrank}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - lol-rank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-lolrank} -d ${PGDATABASE:-lolrank}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lol-rank-pgdata:
