# Docker/PostgreSQL 없이 빠르게 띄워볼 때 사용하는 개발 전용 프로필 (인메모리 H2, 재시작 시 데이터 소멸)
#   ./gradlew bootRun --args='--spring.profiles.active=local-h2'
spring:
  datasource:
    # DB_CLOSE_DELAY=-1: 커넥션 풀이 잠시 비어도 메모리 DB 가 사라지지 않게 한다 (없으면 "this database is empty" 500)
    url: jdbc:h2:mem:lolrank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
