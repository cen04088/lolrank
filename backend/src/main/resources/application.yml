spring:
  application:
    name: lol-rank
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:lolrank}}
    username: ${PGUSER:lolrank}
    password: ${PGPASSWORD:lolrank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # 단일 방 모드: 기동 시 이 코드로 기본 방을 만들고 프론트 "/" 는 이 방으로 바로 들어간다.
  default-room:
    code: ${APP_DEFAULT_ROOM_CODE:LOLRNK}
    name: ${APP_DEFAULT_ROOM_NAME:우리들의 내전}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}
  ai:
    # 장로의 AI 캐스터 해설. 키가 비어 있으면 기능이 꺼지고 프론트 버튼도 숨겨진다.
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: 25
