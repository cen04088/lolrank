spring:
  application:
    name: lol-rank
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:lolrank}}
    username: ${PGUSER:lolrank}
    password: ${PGPASSWORD:lolrank}
    # 소수 인원이 쓰는 앱이라 커넥션을 적게 유지한다 (기본 10개)
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # 동시 요청이 많지 않아 기본 200 스레드 대신 작게 둔다
  tomcat:
    threads:
      max: 20
      min-spare: 2

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # 단일 방 모드: 기동 시 이 코드로 기본 방을 만들고 프론트 "/" 는 이 방으로 바로 들어간다.
  default-room:
    code: ${APP_DEFAULT_ROOM_CODE:LOLRNK}
    name: ${APP_DEFAULT_ROOM_NAME:우리들의 내전}
  balance:
    # 경기 승패를 전투력 보정(레이팅)에 반영할지. 기본 꺼짐: 기록만 쌓이고 밸런스는 계급·티어만 본다.
    rating-enabled: ${APP_RATING_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}
  ai:
    # 장로의 AI 캐스터 해설. 키가 비어 있으면 기능이 꺼지고 프론트 버튼도 숨겨진다.
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: 25
